name: Docker image

# Publishes ghcr.io/somework/lockrot, tagged with the lockrot version pinned in lockrot.env: on
# every release of this action, weekly (so base-image security patches reach the published tags
# without a release), and by hand. The image is signed with cosign (keyless, GitHub OIDC) and
# carries a GitHub build-provenance attestation and an SBOM.

on:
  release:
    types: [published]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      push:
        description: Push to ghcr.io (off = build and test only)
        type: boolean
        default: true

# Nothing by default; the one job lists what publishing needs.
permissions: {}

# One publish at a time per ref; a running publish is never cancelled half-way.
concurrency:
  group: docker-${{ github.ref }}

env:
  IMAGE: ghcr.io/somework/lockrot

jobs:
  publish:
    name: Build, test, sign, publish
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signature and the provenance attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned release
        id: pin
        env:
          PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        run: |
          grep -E '^LOCKROT_(VERSION|SHA256)=' lockrot.env >> "$GITHUB_ENV"
          version=$(grep '^LOCKROT_VERSION=' lockrot.env | cut -d= -f2)
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build for the runner and test it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: lockrot:test
          build-args: |
            LOCKROT_VERSION=${{ env.LOCKROT_VERSION }}
            LOCKROT_SHA256=${{ env.LOCKROT_SHA256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          set -eux
          docker run --rm lockrot:test --version | grep -Fx "lockrot ${LOCKROT_VERSION}"
          docker run --rm -v "$PWD/tests/fixtures/project:/app:ro" lockrot:test --target-php=8.4 --format=json --fail-on=none > report.json
          jq -e '.findings | length >= 1' report.json
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lockrot:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Log in to ghcr.io
        if: steps.pin.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.LOCKROT_VERSION }}
            type=raw,value=${{ steps.pin.outputs.minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=lockrot
            org.opencontainers.image.description=Finds abandoned, unmaintained and branch-pinned packages in composer.lock.
            org.opencontainers.image.vendor=somework
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://lockrot.dev
            org.opencontainers.image.version=${{ env.LOCKROT_VERSION }}
      - name: Build for amd64 and arm64 and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.pin.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            LOCKROT_VERSION=${{ env.LOCKROT_VERSION }}
            LOCKROT_SHA256=${{ env.LOCKROT_SHA256 }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Install cosign
        if: steps.pin.outputs.push == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        if: steps.pin.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest build provenance
        if: steps.pin.outputs.push == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Summary
        if: steps.pin.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## ghcr.io/somework/lockrot"
            echo
            echo '```'
            echo "$TAGS"
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo 'Verify (cosign 3.0 or newer):'
            echo '```bash'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github\\.com/somework/lockrot-action/\\.github/workflows/docker\\.yml@' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://${IMAGE}@${DIGEST} --owner somework"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
