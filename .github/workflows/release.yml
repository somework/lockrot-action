name: Release

# Moves the floating major tag (v1) to every published release so `uses: somework/lockrot-action@v1`
# follows the newest v1.x.y. Pre-releases are left alone.

on:
  release:
    types: [published]

# Nothing by default; the one job asks to push the tag.
permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}

jobs:
  floating-tag:
    name: Move the major tag
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # move the floating tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      # Through the API rather than a git push: no credential is written to disk or put on a
      # command line, and gh reads GH_TOKEN from the environment.
      - name: Point the major tag at this release
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::release tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          major=${TAG%%.*}
          sha=$(git rev-parse HEAD)
          if gh api "repos/${REPO}/git/ref/tags/${major}" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${REPO}/git/refs/tags/${major}" -f sha="$sha" -F force=true > /dev/null
          else
            gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/tags/${major}" -f sha="$sha" > /dev/null
          fi
          echo "$major now points at $TAG (${sha})" >> "$GITHUB_STEP_SUMMARY"
