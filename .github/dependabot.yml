version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The PHP line is a deliberate choice (see the Dockerfile); only digest updates are wanted.
      - dependency-name: php
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
